
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | PaperGraph</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --bg: #101522;
            --card: #1b2232;
            --text: #f4f6fc;
            --muted: #9ba6ba;
            --border: #344057;
            --accent: #a7d65b;
        }

        html[data-theme="light"] {
            --bg: #f0f3f8;
            --card: #ffffff;
            --text: #20283a;
            --muted: #778197;
            --border: #e1e6ee;
            --accent: #668f2e;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            padding: 30px 16px;
        }

        .profile-container {
            max-width: 760px;
            margin: 55px auto;
        }

        .profile-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 35px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--accent);
            color: #17220c;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .detail {
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-top: 15px;
        }

        .detail small { color: var(--muted); }
        .detail p { margin: 5px 0 0; font-weight: 600; }

        .btn-home {
            background: var(--accent);
            color: #17220c;
            font-weight: 700;
        }

        .btn-home:hover { filter: brightness(1.08); }
        .muted { color: var(--muted); }
    </style>
</head>

<body>

<div class="profile-container">
    <a href="/" class="text-decoration-none muted">
        <i class="bi bi-arrow-left"></i> Back to Dashboard
    </a>

    <div class="profile-card mt-4">
        <div class="text-center">
            <div class="avatar mx-auto">
                <i class="bi bi-person"></i>
            </div>

            <h2 id="profileName">Loading profile...</h2>
            <p class="muted">Your PaperGraph account</p>
        </div>

        <hr style="border-color: var(--border);">

        <div class="detail">
            <small>Full Name</small>
            <p id="name">Loading...</p>
        </div>

        <div class="detail">
            <small>Email Address</small>
            <p id="email">Loading...</p>
        </div>

        <div class="detail">
            <small>Account Created</small>
            <p id="createdAt">Loading...</p>
        </div>

        <div id="message" class="mt-3 muted"></div>

        <div class="d-flex gap-2 mt-4">
            <a href="/" class="btn btn-home flex-grow-1">
                <i class="bi bi-house"></i> Dashboard
            </a>

            <button class="btn btn-outline-danger" id="logoutBtn">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </div>
    </div>
</div>

<script>
const savedTheme = localStorage.getItem("papergraph-theme") || "dark";
document.documentElement.dataset.theme = savedTheme;

async function loadProfile() {
    const message = document.getElementById("message");

    try {
        const response = await fetch("/api/profile");

        if (response.status === 401) {
            window.location.href = "/login";
            return;
        }

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Could not load profile");
        }

        document.getElementById("profileName").textContent = data.name;
        document.getElementById("name").textContent = data.name;
        document.getElementById("email").textContent = data.email;

        document.getElementById("createdAt").textContent =
            data.created_at
                ? new Date(data.created_at).toLocaleDateString()
                : "Not available";

    } catch (error) {
        message.textContent = error.message;
    }
}

document.getElementById("logoutBtn").addEventListener("click", async () => {
    const response = await fetch("/api/logout", { method: "POST" });

    if (response.ok) {
        window.location.href = "/login";
    }
});

loadProfile();
</script>

</body>
</html>
